name: MySQL tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  mysql-tests:
    runs-on: ubuntu-latest
    env:
      DB_PORT: 3306

    steps:
      - name: Start isolated MySQL
        run: |
          docker run --detach --rm --name hotel-bome-mysql-ci \
            -e MYSQL_DATABASE=hotel_bome_ci_test \
            -e MYSQL_USER=hotel_bome_ci \
            -e MYSQL_PASSWORD=ci-only-password \
            -e MYSQL_ROOT_PASSWORD=ci-only-root-password \
            -p 127.0.0.1:3306:3306 \
            mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b \
            --log-bin-trust-function-creators=1
          for attempt in {1..30}; do
            if docker exec hotel-bome-mysql-ci mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root-password --silent; then
              exit 0
            fi
            sleep 2
          done
          docker logs hotel-bome-mysql-ci
          exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run full suite on isolated MySQL
        run: composer test:mysql

      - name: Stop isolated MySQL
        if: always()
        run: docker stop hotel-bome-mysql-ci || true
